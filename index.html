<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A to Z फुल्ली फंक्शनल लूडो गेम</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a202c;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 10px; font-size: 28px; text-shadow: 2px 2px 4px rgba(0,0,0,0.6); }
        .game-layout {
            display: flex;
            gap: 30px;
            background: #2d3748;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
            align-items: center;
        }
        canvas {
            border: 4px solid #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            min-width: 220px;
        }
        .status-box {
            font-size: 18px;
            font-weight: bold;
            padding: 15px;
            border-radius: 8px;
            background: #4a5568;
            text-align: center;
            width: 100%;
            border-left: 5px solid #ed8936;
        }
        .dice-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .dice {
            width: 70px;
            height: 70px;
            background: #fff;
            color: #000;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2), 0 4px 6px rgba(0,0,0,0.4);
        }
        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            background: #ed8936;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            width: 100%;
        }
        button:hover { background: #dd6b20; }
        button:disabled { background: #a0aec0; cursor: not-allowed; }
        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #cbd5e0;
            text-align: center;
            max-width: 600px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<h1>मल्टीप्लेयर लूडो (पूर्ण गेम इंजन)</h1>

<div class="game-layout">
    <!-- लूडो ग्राफिक्स बोर्ड -->
    <canvas id="ludoCanvas" width="600" height="600"></canvas>

    <!-- कंट्रोल पैनल -->
    <div class="panel">
        <div class="status-box" id="statusPanel">खेल शुरू करें!</div>
        <div class="dice-container">
            <div class="dice" id="diceBox">-</div>
            <button id="rollBtn" onclick="rollDice()">पासा फेंकें</button>
        </div>
    </div>
</div>

<div class="instructions">
    <strong>नियम:</strong> पासे में <b>6</b> आने पर ही गोटी घर से बाहर (Unlock) निकलेगी। पासा रोल करने के बाद बोर्ड पर मौजूद अपनी गोटी पर क्लिक करके उसे आगे बढ़ाएं। 6 आने पर या विरोधी की गोटी काटने पर आपको **दोबारा चांस** मिलेगा!
</div>

<script>
const canvas = document.getElementById('ludoCanvas');
const ctx = canvas.getContext('2d');
const S = 600; // बोर्ड का साइज
const C = S / 15; // 40px प्रति बॉक्स

const COLORS = { 0: '#e74c3c', 1: '#2ecc71', 2: '#f1c40f', 3: '#3498db' }; // लाल, हरा, पीला, नीला
const PLAYER_NAMES = ['लाल (Red)', 'हरा (Green)', 'पीला (Yellow)', 'नीला (Blue)'];

// पूरे लूडो ट्रैक के 52 खानों के ग्रिड कोऑर्डिनेट्स (X, Y)
const TRACK = [
    {x:1,y:6}, {x:2,y:6}, {x:3,y:6}, {x:4,y:6}, {x:5,y:6},
    {x:6,y:5}, {x:6,y:4}, {x:6,y:3}, {x:6,y:2}, {x:6,y:1}, {x:6,y:0},
    {x:7,y:0}, {x:8,y:0},
    {x:8,y:1}, {x:8,y:2}, {x:8,y:3}, {x:8,y:4}, {x:8,y:5},
    {x:9,y:6}, {x:10,y:6}, {x:11,y:6}, {x:12,y:6}, {x:13,y:6}, {x:14,y:6},
    {x:14,y:7}, {x:14,y:8},
    {x:13,y:8}, {x:12,y:8}, {x:11,y:8}, {x:10,y:8}, {x:9,y:8},
    {x:8,y:9}, {x:8,y:10}, {x:8,y:11}, {x:8,y:12}, {x:8,y:13}, {x:8,y:14},
    {x:7,y:14}, {x:6,y:14},
    {x:6,y:13}, {x:6,y:12}, {x:6,y:11}, {x:6,y:10}, {x:6,y:9},
    {x:5,y:8}, {x:4,y:8}, {x:3,y:8}, {x:2,y:8}, {x:1,y:8}, {x:0,y:8},
    {x:0,y:7}, {x:0,y:6}
];

// प्रत्येक खिलाड़ी की होम एंट्री, बेस लोकेशन और अंदर का रास्ता
const PLAYER_CONFIG = [
    // 0: Red
    { startTrack: 0, homeEntry: 50, basePos: [{x:1.5,y:1.5},{x:3.5,y:1.5},{x:1.5,y:3.5},{x:3.5,y:3.5}], homeCells: [{x:1,y:7},{x:2,y:7},{x:3,y:7},{x:4,y:7},{x:5,y:7}] },
    // 1: Green
    { startTrack: 13, homeEntry: 11, basePos: [{x:10.5,y:1.5},{x:12.5,y:1.5},{x:10.5,y:3.5},{x:12.5,y:3.5}], homeCells: [{x:7,y:1},{x:7,y:2},{x:7,y:3},{x:7,y:4},{x:7,y:5}] },
    // 2: Yellow
    { startTrack: 26, homeEntry: 24, basePos: [{x:10.5,y:10.5},{x:12.5,y:10.5},{x:10.5,y:12.5},{x:12.5,y:12.5}], homeCells: [{x:13,y:7},{x:12,y:7},{x:11,y:7},{x:10,y:7},{x:9,y:7}] },
    // 3: Blue
    { startTrack: 39, homeEntry: 37, basePos: [{x:1.5,y:10.5},{x:3.5,y:10.5},{x:1.5,y:12.5},{x:3.5,y:12.5}], homeCells: [{x:7,y:13},{x:7,y:12},{x:7,y:11},{x:7,y:10},{x:7,y:9}] }
];

const SAFE_SECTIONS =; // सुरक्षित खाने (स्टार जोन)

let gameState = {
    turn: 0,
    diceValue: 0,
    hasRolled: false,
    tokens: [
        [-1, -1, -1, -1], // Red गोटियाँ (-1 = घर के अंदर लॉक)
        [-1, -1, -1, -1], // Green
        [-1, -1, -1, -1], // Yellow
        [-1, -1, -1, -1]  // Blue
    ]
};

// पूरा लूडो बोर्ड डिजाइन ड्रा करना
function drawBoard() {
    ctx.clearRect(0, 0, S, S);

    // 1. ग्रिड और चार बड़े घर बनाना
    for(let r=0; r<15; r++){
        for(let c=0; c<15; c++){
            ctx.strokeStyle = '#cbd5e0';
            ctx.lineWidth = 1;
            ctx.fillStyle = '#fff';
            
            if(r<6 && c<6) ctx.fillStyle = COLORS[1]; // Green Base
            else if(r<6 && c>8) ctx.fillStyle = COLORS[2]; // Yellow Base
            else if(r>8 && c>8) ctx.fillStyle = COLORS[3]; // Blue Base
            else if(r>8 && c<6) ctx.fillStyle = COLORS[0]; // Red Base
            
            ctx.fillRect(c*C, r*C, C, C);
            ctx.strokeRect(c*C, r*C, C, C);
        }
    }

    // 2. होम रन पाथ (गोटियों के रंगीन रास्ते)
    for(let p=0; p<4; p++) {
        PLAYER_CONFIG[p].homeCells.forEach(cell => {
            ctx.fillStyle = COLORS[p];
            ctx.fillRect(cell.x*C, cell.y*C, C, C);
            ctx.strokeRect(cell.x*C, cell.y*C, C, C);
        });
        // शुरुआती बॉक्स हाइलाइट
        let startCell = TRACK[PLAYER_CONFIG[p].startTrack];
        ctx.fillStyle = COLORS[p];
        ctx.fillRect(startCell.x*C, startCell.y*C, C, C);
    }

    // 3. स्टार (सुरक्षित खाने) ड्रा करना
    SAFE_SECTIONS.forEach(idx => {
        let cell = TRACK[idx];
        ctx.fillStyle = '#edf2f7';
        ctx.fillRect(cell.x*C, cell.y*C, C, C);
        ctx.fillStyle = '#4a5568';
        ctx.font = "22px Arial";
        ctx.fillText("★", cell.x*C + 10, cell.y*C + 28);
    });

    // 4. बीच का त्रिकोणीय एंड पॉइंट (Center Home)
    ctx.fillStyle = COLORS[0]; ctx.beginPath(); ctx.moveTo(6*C,6*C); ctx.lineTo(7.5*C,7.5*C); ctx.lineTo(6*C,9*C); ctx.fill(); // Red
    ctx.fillStyle = COLORS[1]; ctx.beginPath(); ctx.moveTo(6*C,6*C); ctx.lineTo(7.5*C,7.5*C); ctx.lineTo(9*C,6*C); ctx.fill(); // Green
    ctx.fillStyle = COLORS[2]; ctx.beginPath(); ctx.moveTo(9*C,6*C); ctx.lineTo(7.5*C,7.5*C); ctx.lineTo(9*C,9*C); ctx.fill(); // Yellow
    ctx.fillStyle = COLORS[3]; ctx.beginPath(); ctx.moveTo(6*C,9*C); ctx.lineTo(7.5*C,7.5*C); ctx.lineTo(9*C,9*C); ctx.fill(); // Blue

    // 5. घरों के अंदर सफेद बॉक्स (जहाँ गोटियाँ बैठती हैं)
    for(let p=0; p<4; p++) {
        PLAYER_CONFIG[p].basePos.forEach(pos => {
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(pos.x*C, pos.y*C, C/1.8, 0, 2*Math.PI);
            ctx.fill();
            ctx.stroke();
        });
    }

    // 6. गोटियाँ (Tokens) ड्रा करना
    for(let p=0; p<4; p++) {
        for(let t=0; t<4; t++) {
            let step = gameState.tokens[p][t];
            let x, y;

            if(step === -1) { // लॉक स्थिति में घर के अंदर
                x = PLAYER_CONFIG[p].basePos[t].x * C;
                y = PLAYER_CONFIG[p].basePos[t].y * C;
            } else if(step >= 57) { // जीत की स्थिति (होम)
                x = 7.5 * C;
                y = 7.5 * C;
            } else if(step >= 51) { // रंगीन होम गैलरी में
                let cell = PLAYER_CONFIG[p].homeCells[step - 51];
                x = cell.x * C + C/2;
                y = cell.y * C + C/2;
            } else { // बाहर के रास्ते पर दौड़ते हुए
                let trackIdx = (PLAYER_CONFIG[p].startTrack + step) % 52;
                let cell = TRACK[trackIdx];
                x = cell.x * C + C/2;
                y = cell.y * C + C/2;
            }

            // अगर एक ही खाने में एक से ज़्यादा गोटियाँ हों तो ओवरलैप से बचाने के लिए थोड़ा खिसकाना
            let offset = t * 3 - 4;
            ctx.fillStyle = COLORS[p];
            ctx.beginPath();
            ctx.arc(x + offset, y + offset, 13, 0, 2*Math.PI);
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(x + offset, y + offset, 6, 0, 2*Math.PI);
            ctx.strokeStyle = '#fff';
            ctx.stroke();
        }
    }
}

// पासा फेंकना (Dice Roll Engine)
function rollDice() {
    if(gameState.hasRolled) return;

    gameState.diceValue = Math.floor(Math.random() * 6) + 1;
