<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MR Ludo</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#101827;
color:white;
text-align:center;
}

h1{
margin:18px 0 5px;
font-size:32px;
}

p{
margin:5px;
color:#cbd5e1;
}

.game{
max-width:600px;
margin:auto;
padding:15px;
}

.board{
width:min(92vw,520px);
height:min(92vw,520px);
margin:20px auto;
display:grid;
grid-template-columns:repeat(15,1fr);
grid-template-rows:repeat(15,1fr);
background:white;
border:8px solid white;
box-shadow:0 8px 25px #0008;
}

.cell{
border:1px solid #bbb;
background:white;
}

.red{background:#ef4444}
.green{background:#22c55e}
.yellow{background:#facc15}
.blue{background:#3b82f6}

.home{
grid-column:span 6;
grid-row:span 6;
display:flex;
align-items:center;
justify-content:center;
font-size:38px;
border:8px solid white;
}

.path{
background:#fff;
}

.center{
grid-column:7;
grid-row:7;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
background:linear-gradient(135deg,#ef4444,#3b82f6);
}

.controls{
background:#1e293b;
padding:20px;
border-radius:18px;
}

.dice{
font-size:70px;
margin:10px;
}

button{
background:#facc15;
border:0;
padding:14px 30px;
border-radius:30px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:active{
transform:scale(.95);
}

#message{
margin:15px;
font-size:18px;
}
</style>
</head>

<body>

<h1>🎲 MR Ludo</h1>
<p>Free Online Ludo Game</p>

<div class="game">

<div class="board">

<div class="home red">🔴</div>
<div class="path"></div>
<div class="home green">🟢</div>

<div class="path"></div>
<div class="path"></div>
<div class="path"></div>

<div class="home yellow">🟡</div>
<div class="path"></div>
<div class="home blue">🔵</div>

<div class="center">★</div>

</div>

<div class="controls">

<div class="dice" id="dice">🎲</div>

<div id="message">
आपकी बारी है — Dice Roll करें
</div>

<button onclick="rollDice()">🎲 Roll Dice</button>

<h3>आपका Score: <span id="score">0</span></h3>

</div>

</div>

<script>

let score = 0;

function rollDice(){

let number = Math.floor(Math.random()*6)+1;

let dice = ["⚀","⚁","⚂","⚃","⚄","⚅"];

document.getElementById("dice").innerText =
dice[number-1];

score += number;

document.getElementById("score").innerText =
score;

document.getElementById("message").innerText =
"आपने "+number+" निकाला! 🎉";

}

</script>

</body>
</html>
